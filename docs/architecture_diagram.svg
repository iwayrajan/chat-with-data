<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg">
<title>Chat with Data architecture</title>
<desc>Two-phase diagram: a loading phase that turns uploaded spreadsheets into schema-summarized dataframes, and a query phase that generates and safely executes code to answer each question, with a retry loop on error.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="30" y="45" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="100" y="65" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Upload files</text>
<text x="100" y="83" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">CSV / multi-sheet Excel</text>

<rect x="195" y="45" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="265" y="65" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Load as DataFrames</text>
<text x="265" y="83" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">One per sheet/file</text>

<rect x="360" y="45" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="430" y="65" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Schema summary</text>
<text x="430" y="83" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">Columns, dtypes, samples</text>

<line x1="170" y1="73" x2="195" y2="73" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="335" y1="73" x2="360" y2="73" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="30" y="210" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="100" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">User question</text>
<text x="100" y="248" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">Typed in chat</text>

<rect x="195" y="210" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="265" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Groq writes code</text>
<text x="265" y="248" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">pandas + Plotly</text>

<rect x="360" y="210" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="430" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Sandboxed execution</text>
<text x="430" y="248" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">Restricted exec()</text>

<rect x="525" y="210" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="595" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Chart or answer</text>
<text x="595" y="248" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">fig or result</text>

<line x1="170" y1="238" x2="195" y2="238" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="335" y1="238" x2="360" y2="238" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="500" y1="238" x2="525" y2="238" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Main flow: schema summary feeds into the query phase -->
<path d="M430 101 L430 150 L100 150 L100 210" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Retry loop: sandboxed execution errors feed back into code generation -->
<path d="M430 210 L430 180 L265 180 L265 210" fill="none" stroke="#C0392B" stroke-width="0.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
<text x="347" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C0392B">error \u2192 retry (up to 2x)</text>
</svg>
