<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<title>Chart vs. text routing logic</title>
<desc>Decision flow showing that a single code-generation step decides for itself whether a question needs a chart or a direct text answer, based on which variable the generated code assigns.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="265" y="30" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User question</text>

<rect x="215" y="110" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="130" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Groq writes code</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">decides fig vs. result itself</text>

<path d="M340 74 L340 110" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M340 166 L340 190 L175 190 L175 220" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 166 L340 190 L505 190 L505 220" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="175" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">assigns `fig`</text>
<text x="505" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">assigns `result`</text>

<rect x="80" y="220" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="175" y="240" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Visual question</text>
<text x="175" y="258" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">"plot revenue by month"</text>

<rect x="410" y="220" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="505" y="240" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Direct question</text>
<text x="505" y="258" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">"average order value?"</text>

<line x1="175" y1="276" x2="175" y2="320" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="505" y1="276" x2="505" y2="320" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="80" y="320" width="190" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="175" y="342" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#085041">Plotly chart rendered</text>

<rect x="410" y="320" width="190" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="505" y="342" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#3C3489">Number / table / text shown</text>
</svg>
